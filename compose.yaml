services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: akw
      POSTGRES_USER: akw
      POSTGRES_PASSWORD: ${AKW_DEV_POSTGRES_PASSWORD:-local_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - akw_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akw -d akw"]
      interval: 3s
      timeout: 3s
      retries: 15
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AKW_DEV_S3_USER:-akw_local}
      MINIO_ROOT_PASSWORD: ${AKW_DEV_S3_PASSWORD:-akw_local_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - akw_minio:/data
  redis:
    image: redis:7.4-alpine
    profiles: ["cache"]
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  akw_postgres:
  akw_minio:
